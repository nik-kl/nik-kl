name: Update disclosures

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: disclosures
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render disclosures from 0w30.uk
        run: python3 .github/scripts/update_disclosures.py

      - name: Commit if README changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes."
            exit 0
          fi
          # Commit via the API so GitHub signs it (Verified); the blob sha makes it fail instead of overwriting newer work.
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/README.md?ref=main" --jq .sha)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/README.md" \
            -f message="Update disclosures from 0w30.uk" \
            -f content="$(base64 -w0 README.md)" \
            -f sha="$sha" \
            -f branch=main
